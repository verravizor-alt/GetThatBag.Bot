services:
  - type: web
    name: getthatbag-openclaw
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      # LLM API Keys — free tiers
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Slack integration
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: OWNER_SLACK_ID
        sync: false
      # Telegram integration (set after creating bot at t.me/BotFather)
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # GetThatBag site webhook URL
      - key: GETTHATBAG_WEBHOOK_URL
        value: https://getthatbagllc.manus.space/api/scheduled/outreach-batch
